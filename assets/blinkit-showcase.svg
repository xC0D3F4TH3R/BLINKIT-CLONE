    <style>
      .float { animation: float 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float.delay { animation-delay: -1.7s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .orbit { animation: orbit 18s linear infinite; transform-box: fill-box; transform-origin: center; }
      .glint { animation: glint 3s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes glint { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    </style>
  </defs>
